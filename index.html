<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landing - Ashish's Portfolio (Subtle Dark Theme)</title>
    <style>
      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Courier New", monospace;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        background-color: #121212;
        color: #bbb;
        overflow: hidden;
        position: relative;
      }

      #codeCanvas {
        position: fixed;
        inset: 0;
        z-index: 1;
        opacity: 0.07;
        background-color: transparent;
      }

      #landingPage {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 10;
        user-select: none;
        text-align: center;
        opacity: 1;
        transition: opacity 1s ease;
        padding: 0 15px;
      }

      #landingPage.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .landing-content {
        position: relative;
        z-index: 20;
        max-width: 700px;
        width: 100%;
      }

      .typewriter-text {
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        font-weight: 900;
        color: #ccc;
        letter-spacing: 3px;
        margin-bottom: 12px;
        user-select: none;
      }

      .cursor {
        display: inline-block;
        font-weight: 900;
        color: #999;
        animation: blink 0.8s steps(2, start) infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* Racing car container */
      .racing-car-container {
        position: fixed;
        bottom: 20px;
        left: -120px; /* start offscreen left */
        width: 100px;
        height: 40px;
        z-index: 25;
        animation: moveRight 4s linear infinite;
        pointer-events: none;
        user-select: none;
      }

      /* Racing car SVG styling */
      .racing-car {
        width: 100%;
        height: 100%;
        fill: #6d97d2;
        stroke: #ccc;
        stroke-width: 2;
      }

      /* Move car from left to right */
      @keyframes moveRight {
        0% {
          left: -120px;
        }
        100% {
          left: 110vw; /* goes beyond right edge */
        }
      }

      .bouncing-balls {
        position: fixed;
        bottom: 120px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 15px;
        z-index: 30;
        user-select: none;
        pointer-events: none;
      }

      .bouncing-ball {
        width: 18px;
        height: 18px;
        background: #666;
        border-radius: 50%;
        animation: bounce 1.5s ease-in-out infinite;
      }

      .bouncing-ball:nth-child(2) {
        animation-delay: 0.2s;
      }

      .bouncing-ball:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.6;
        }
        50% {
          transform: translateY(-30px);
          opacity: 1;
        }
      }

      @media (max-width: 768px) {
        .typewriter-text {
          font-size: clamp(2rem, 7vw, 3rem);
          letter-spacing: 2px;
        }
        .racing-car-container {
          width: 70px;
          height: 28px;
          bottom: 18px;
        }
        .bouncing-ball {
          width: 14px;
          height: 14px;
          background: #888;
        }
      }

      @media (max-width: 480px) {
        .typewriter-text {
          font-size: clamp(1.5rem, 10vw, 2rem);
          letter-spacing: 1.5px;
        }
        .racing-car-container {
          width: 55px;
          height: 22px;
          bottom: 15px;
        }
        .bouncing-ball {
          width: 12px;
          height: 12px;
          background: #aaa;
        }
      }
    </style>
  </head>
  <body>
    <div id="landingPage" role="main" aria-label="Welcome landing page">
      <canvas id="codeCanvas" aria-hidden="true"></canvas>
      <div class="landing-content">
        <h1 class="typewriter-text" aria-live="polite">
          Welcome to
          <span style="color: #6d97d2; font-weight: bold">Ashish's</span>
          <br />. <span id="animated-text"></span><span class="cursor">|</span>.
        </h1>
      </div>

      <!-- Racing Car SVG container -->
      <div
        class="racing-car-container"
        aria-hidden="true"
        role="img"
        aria-label="Racing car"
      >
        <svg
          class="racing-car"
          viewBox="0 0 64 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
        >
          <!-- Car body -->
          <rect x="4" y="8" width="50" height="10" rx="3" ry="3" />
          <rect
            x="14"
            y="2"
            width="24"
            height="8"
            rx="2"
            ry="2"
            fill="#4b7bcf"
          />
          <!-- Wheels -->
          <circle cx="14" cy="20" r="6" fill="#222" />
          <circle cx="14" cy="20" r="3" fill="#6d97d2" />
          <circle cx="46" cy="20" r="6" fill="#222" />
          <circle cx="46" cy="20" r="3" fill="#6d97d2" />
        </svg>
      </div>

      <div class="bouncing-balls" aria-hidden="true">
        <div class="bouncing-ball"></div>
        <div class="bouncing-ball"></div>
        <div class="bouncing-ball"></div>
      </div>
    </div>

    <script>
      // Typing animation only for dynamic word
      const texts = [
        "Portfolio",
        // "Creativity",
        // "Code",
        // "Passion",
        // "Performance",
        // "Scalability",
      ];
      let count = 0,
        index = 0,
        currentText = "",
        isDeleting = false;

      function type() {
        const animatedText = document.getElementById("animated-text");
        if (count >= texts.length) count = 0;
        let fullText = texts[count];

        if (isDeleting) {
          currentText = fullText.substring(0, index--);
        } else {
          currentText = fullText.substring(0, index++);
        }

        animatedText.textContent = " " + currentText;

        let timeout = 200;

        if (!isDeleting && currentText === fullText) {
          timeout = 1500;
          isDeleting = true;
        } else if (isDeleting && currentText === "") {
          isDeleting = false;
          count++;
          index = 0;
          timeout = 500;
        }

        setTimeout(type, timeout);
      }

      // Matrix code rain effect
      function setupMatrix() {
        const canvas = document.getElementById("codeCanvas");
        const ctx = canvas.getContext("2d");
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const letters = "＿／＼＿§✦⚡><!{}[]()*&^%$@#~".split("");
        const fontSize = 18;
        const columns = Math.floor(width / fontSize);
        const drops = new Array(columns).fill(1);

        function draw() {
          ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
          ctx.fillRect(0, 0, width, height);
          ctx.fillStyle = "#bbb";
          ctx.font = fontSize + "px monospace";

          for (let i = 0; i < drops.length; i++) {
            const text = letters[Math.floor(Math.random() * letters.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > height && Math.random() > 0.975) {
              drops[i] = 0;
            }
            drops[i]++;
          }
        }
        setInterval(draw, 60);

        window.addEventListener("resize", () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });
      }

      window.addEventListener("load", () => {
        setupMatrix();
        type();

        const landingPage = document.getElementById("landingPage");

        setTimeout(() => {
          landingPage.classList.add("fade-out");
        }, 3000);

        landingPage.addEventListener("transitionend", () => {
          if (landingPage.classList.contains("fade-out")) {
            window.location.href = "portfolio.html"; // Adjust if needed
          }
        });
      });
    </script>
  </body>
</html>
